# MAGDOX Code Security - GitHub Actions
#
# Add this workflow to .github/workflows/magdox.yml in your PRIVATE repository.
# Manual runs on the default branch only; never enable in a public repository.
# Required secret: MAGDOX_TOKEN (create with `magdox token create --label ci`)
#
# Prerequisite: the MAGDOX v1.3.2 launcher release (package version 1.3.2) and an available
# authenticated distribution service with signed engine artifacts and rules.
# MAGDOX_TOKEN must have product access. Provision the private engine before scanning.
# Review this template for your runner and verify the resulting scan coverage.
# Legacy choice: keep an approved, pinned monolithic CLI in a separate job and
# omit `magdox install` there. Never ignore a failed install to fall back to it.
#
# Scanner-only job: do not add repository builds, dependency installs or hooks.
# Use an ephemeral non-root runner with curl, Python 3.9+ and CA certificates.
# Never cache/upload MAGDOX config, credentials, rules, engines or plugins as CI
# artifacts. Do not provide the token to public forks or use pull_request_target.
# Optional PR comments use the integration credential configured in the MAGDOX
# dashboard; this scanner job does not need pull-requests: write.

name: MAGDOX Security Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Security scan
    # Public logs and fork/PR runs must not receive private components.
    if: github.event_name == 'workflow_dispatch' && github.event.repository.private == true && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    env:
      MAGDOX_VERSION: "v1.3.2" # Release namespace; npm/semantic version is 1.3.2.
      MAGDOX_PROJECT: ${{ github.event.repository.name }}
    steps:
      - name: Isolate MAGDOX state on the runner
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo "MAGDOX_INSTALL_DIR=$RUNNER_TEMP/magdox-bin" >> "$GITHUB_ENV"
          echo "MAGDOX_CONFIG_DIR=$RUNNER_TEMP/magdox-config" >> "$GITHUB_ENV"
          echo "MAGDOX_CACHE_DIR=$RUNNER_TEMP/magdox-cache" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install public MAGDOX launcher
        run: |
          set -eu
          installer=$(mktemp "$RUNNER_TEMP/magdox-installer.XXXXXX")
          trap 'rm -f -- "$installer"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://magdox.io/install.sh --output "$installer"
          sh "$installer"
          echo "$MAGDOX_INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Authorize and install private engine
        env:
          MAGDOX_TOKEN: ${{ secrets.MAGDOX_TOKEN }}
        run: |
          set -eu
          : "${MAGDOX_TOKEN:?Configure the MAGDOX_TOKEN secret with product access}"
          magdox version
          magdox install

      - name: Run scan
        env:
          MAGDOX_TOKEN: ${{ secrets.MAGDOX_TOKEN }}
          MAGDOX_COMMIT: ${{ github.sha }}
          MAGDOX_BRANCH: ${{ github.head_ref || github.ref_name }}
          # PR context — auto-detected by the CLI from GITHUB_REF and GITHUB_REPOSITORY.
          # The comment is posted only when a MAGDOX_GITHUB_TOKEN is configured in
          # Settings > Integrations in your MAGDOX dashboard.
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          magdox scan . \
            --upload \
            --project "$MAGDOX_PROJECT" \
            --fail-on high \
            --format text

      # Optional: full scan with all surfaces
      # - name: Full scan
      #   env:
      #     MAGDOX_TOKEN: ${{ secrets.MAGDOX_TOKEN }}
      #     MAGDOX_COMMIT: ${{ github.sha }}
      #     MAGDOX_BRANCH: ${{ github.head_ref || github.ref_name }}
      #     GITHUB_REPOSITORY: ${{ github.repository }}
      #     GITHUB_REF: ${{ github.ref }}
      #   run: |
      #     magdox scan . \
      #       --full \
      #       --upload \
      #       --project "$MAGDOX_PROJECT" \
      #       --fail-on high
